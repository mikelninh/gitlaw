name: Viewer CI

on:
  pull_request:
    paths:
      - 'viewer/**'
      - 'api/**'
      - 'laws/bgb.md'
      - '.github/workflows/viewer-ci.yml'
  push:
    branches:
      - agent/mietrecht-research-desk
    paths:
      - 'viewer/**'
      - 'api/**'
      - 'laws/bgb.md'
      - '.github/workflows/viewer-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install viewer dependencies
        working-directory: viewer
        run: npm install --no-audit --no-fund
      - name: Run Mietrecht regression
        working-directory: viewer
        run: node scripts/mietrecht-regression.mjs
      - name: Run cross-domain routing regression
        working-directory: viewer
        run: node --experimental-strip-types scripts/legal-scenario-regression.mjs
      - name: Build viewer
        working-directory: viewer
        run: npm run build
      - name: Upload built viewer for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: gitlaw-viewer-preview
          path: viewer/dist
          if-no-files-found: error
          retention-days: 1
