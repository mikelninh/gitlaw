name: Legal claim refusal proof
on:
  pull_request:
    paths:
      - 'evals/legal_claim_guard.py'
      - 'evals/test_legal_claim_guard.py'
      - '.github/workflows/legal-claim-proof.yml'
  workflow_dispatch:
jobs:
  negative-claim-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check unsupported claims are not released
        run: python -m unittest discover -s evals -p 'test_legal_claim_guard.py' -v
