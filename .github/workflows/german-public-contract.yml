name: German public benchmark contract

on:
  push:
    branches: [main, 'feat/ypog-**']
    paths:
      - 'evals/german_public/**'
      - 'evals/ypog/release_criteria.json'
      - 'scripts/german-public-benchmark-gate.mjs'
      - '.github/workflows/german-public-contract.yml'
  pull_request:
    paths:
      - 'evals/german_public/**'
      - 'evals/ypog/release_criteria.json'
      - 'scripts/german-public-benchmark-gate.mjs'
      - '.github/workflows/german-public-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/german-public-benchmark-gate.mjs
