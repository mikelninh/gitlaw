name: External retrieval tournament

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'evals/external/run_retrieval_tournament.py'
      - 'evals/external/requirements-tournament.txt'
      - '.github/workflows/retrieval-tournament.yml'
  pull_request:
    paths:
      - 'evals/external/run_retrieval_tournament.py'
      - 'evals/external/requirements-tournament.txt'
      - '.github/workflows/retrieval-tournament.yml'

concurrency:
  group: external-retrieval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: evals/external/requirements-tournament.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-retrieval-tournament-v1-${{ runner.os }}
      - name: Install tournament dependencies
        run: pip install -r evals/external/requirements-tournament.txt
      - name: Execute pinned Legal RAG Bench retrieval tournament
        run: python evals/external/run_retrieval_tournament.py --json-out retrieval-tournament.json
      - name: Verify tournament integrity and print scoreboard
        run: |
          python - <<'PY'
          import json
          r=json.load(open('retrieval-tournament.json', encoding='utf-8'))
          assert r['status'] == 'OBSERVED_EXTERNAL_RETRIEVAL_TOURNAMENT', r
          assert r['dataset_revision'] == 'db0b31dc6d195ce9916897e1ac5e4e6209736c8a', r
          assert r['n_questions'] == 100 and r['n_passages'] == 4876, r
          assert len(r['model_revisions']['dense_general']['revision']) >= 12, r
          assert len(r['model_revisions']['reranker']['revision']) >= 12, r
          assert len(r['model_revisions']['dense_legal']['revision']) >= 12, r
          expected_bm25={'hit_at_1':0.14,'hit_at_5':0.30,'hit_at_10':0.31,'mrr':0.21812319724933016}
          for key, expected in expected_bm25.items():
              assert abs(r['methods']['bm25'][key]-expected) < 1e-12, (key, r['methods']['bm25'][key], expected)
          for name, m in r['methods'].items():
              for key in ('hit_at_1','hit_at_5','hit_at_10','mrr'):
                  assert 0 <= m[key] <= 1, (name,key,m[key])
              assert len(m['rows']) == 100, name
          print('\nMETHOD\tH@1\tH@5\tH@10\tMRR\tMISS@10')
          for name,m in r['methods'].items():
              print(f"{name}\t{m['hit_at_1']:.3f}\t{m['hit_at_5']:.3f}\t{m['hit_at_10']:.3f}\t{m['mrr']:.3f}\t{m['missed_top_10']}")
          print('\nWINNER=' + r['winner_by_hit_at_10_then_mrr'])
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('retrieval-tournament.json') != '' }}
        with:
          name: legal-rag-bench-retrieval-tournament
          path: retrieval-tournament.json
          if-no-files-found: error
          retention-days: 30