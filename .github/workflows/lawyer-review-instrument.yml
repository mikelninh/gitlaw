name: Lawyer review instrument

on:
  push:
    branches: [main]
    paths:
      - 'evals/german_gold/review.schema.json'
      - 'evals/german_gold/review_aggregator.py'
      - 'evals/german_gold/test_review_aggregator.py'
      - 'viewer/public/ypog/review/**'
      - 'docs/ypog/REVIEWER_PILOT_RUNBOOK.md'
      - 'scripts/german-gold-gate.mjs'
      - '.github/workflows/lawyer-review-instrument.yml'
  pull_request:
    paths:
      - 'evals/german_gold/review.schema.json'
      - 'evals/german_gold/review_aggregator.py'
      - 'evals/german_gold/test_review_aggregator.py'
      - 'viewer/public/ypog/review/**'
      - 'docs/ypog/REVIEWER_PILOT_RUNBOOK.md'
      - 'scripts/german-gold-gate.mjs'
      - '.github/workflows/lawyer-review-instrument.yml'

concurrency:
  group: lawyer-review-instrument-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Review aggregator unit contract
        run: python evals/german_gold/test_review_aggregator.py
      - name: German Gold + independent review anti-inflation gate
        run: node scripts/german-gold-gate.mjs
      - name: Static reviewer workbench safety contract
        run: |
          test -f viewer/public/ypog/review/index.html
          grep -q 'This does not create gold automatically' viewer/public/ypog/review/index.html
          grep -q 'Never paste confidential client data' viewer/public/ypog/review/index.html
          grep -q 'Everything on this page stays in the browser' viewer/public/ypog/review/index.html
          grep -q 'independent reviewer' viewer/public/ypog/review/index.html
      - name: Runbook anti-inflation contract
        run: |
          grep -q 'do not count as satisfying' docs/ypog/REVIEWER_PILOT_RUNBOOK.md
          grep -q 'A candidate is never promoted merely because a JSON review file exists' docs/ypog/REVIEWER_PILOT_RUNBOOK.md
