name: Law Firm Pilot CI

on:
  pull_request:
    paths:
      - 'pilot/law-firm/**'
      - 'api/pro/pilot-replay.ts'
      - 'api/mandant/upload.ts'
      - 'api/_llm.ts'
      - 'api/_audit.ts'
      - 'api/_ratelimit.ts'
      - 'gitlaw_mcp/citations.py'
      - 'gitlaw_mcp/tests/**'
      - 'laws/bgb.md'
      - 'viewer/src/pro/**'
      - 'viewer/src/mandant/**'
      - 'viewer/public/law-firm-pilot.html'
      - 'viewer/public/migration-client-demo.html'
      - 'viewer/public/migration-office-demo.html'
      - '.gitignore'
      - '.github/workflows/law-firm-pilot-ci.yml'
  push:
    branches: [main]
    paths:
      - 'pilot/law-firm/**'
      - 'api/pro/pilot-replay.ts'
      - 'api/mandant/upload.ts'
      - 'gitlaw_mcp/citations.py'
      - 'viewer/src/pro/**'
      - 'viewer/src/mandant/**'
      - 'viewer/public/law-firm-pilot.html'
      - 'viewer/public/migration-client-demo.html'
      - 'viewer/public/migration-office-demo.html'
      - '.github/workflows/law-firm-pilot-ci.yml'

jobs:
  pilot-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install root, API and Python test dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --prefix api --no-audit --no-fund
          python -m pip install --disable-pip-version-check pytest

      - name: Run law-firm pilot edge cases
        run: node --test pilot/law-firm/core.test.mjs

      - name: Run assistant console HTTP end-to-end
        run: node --test pilot/law-firm/ops-console.e2e.test.mjs

      - name: Run migration document ground-truth contracts
        run: node --test pilot/law-firm/migration-document-workflow.test.mjs

      - name: Preserve GitLaw citation contract
        run: python -m gitlaw_mcp.tests.test_eval

      - name: Type-check pilot API boundary
        run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --esModuleInterop --skipLibCheck api/pro/pilot-replay.ts

      - name: Verify customer and assistant simplicity contracts
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const customer=fs.readFileSync('viewer/public/law-firm-pilot.html','utf8');
          const ops=fs.readFileSync('pilot/law-firm/ASSISTANT_ONE_PAGE.md','utf8');
          const legal=fs.readFileSync('pilot/law-firm/LEGAL_GATES.md','utf8');
          const workflow=fs.readFileSync('pilot/law-firm/MIGRATION_DOCUMENT_WORKFLOW.md','utf8');
          const goLive=fs.readFileSync('pilot/law-firm/GO_LIVE_CHECKLIST.md','utf8');
          const clientDemo=fs.readFileSync('viewer/public/migration-client-demo.html','utf8');
          const officeDemo=fs.readFileSync('viewer/public/migration-office-demo.html','utf8');
          const api=fs.readFileSync('api/pro/pilot-replay.ts','utf8');
          for(const text of ['20–30','Richtig','Ändern','Falsch','WEITER','VERBESSERN','STOPPEN','WEITER MESSEN']) if(!customer.includes(text)) throw new Error('customer contract missing '+text);
          for(const text of ['STARTEN','ANFORDERN','WARTEN','STOPP']) if(!ops.includes(text)) throw new Error('ops contract missing '+text);
          for(const text of ['§ 43e BRAO','§ 203 StGB','Art. 28 DSGVO','kein Rechtsgutachten']) if(!legal.includes(text)) throw new Error('legal contract missing '+text);
          for(const text of ['FEHLT','ANGEFRAGT','EINGEGANGEN','ZU PRÜFEN','BESTÄTIGT','NEU ANFORDERN','NICHT ERFORDERLICH','BEREIT FÜR ANWALT','AKTE FREIGEBEN']) if(!workflow.includes(text)) throw new Error('workflow contract missing '+text);
          for(const text of ['DEMO','keine echten Mandantendaten']) if(!clientDemo.includes(text)||!officeDemo.includes(text)) throw new Error('demo safety banner missing '+text);
          for(const text of ['Real-Client-Mode','AVV','Art. 9','Art. 10','EU']) if(!goLive.includes(text)) throw new Error('go-live gate missing '+text);
          for(const text of ['GITLAW_PILOT_SERVICE_TOKEN','STOPP_PRIVACY','execution_allowed: false']) if(!api.includes(text)) throw new Error('api boundary missing '+text);
          if(customer.includes('automatische Rechtsberatung')) throw new Error('unsafe customer claim');
          console.log('customer/assistant/legal/document-workflow contracts: OK');
          NODE
