name: LegalQuAD provenance-gated retrieval candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'evals/german_public/run_legalquad_retrieval.py'
      - 'evals/german_public/run_legalquad_e5_challenger.py'
      - 'evals/german_public/legalquad_candidate.json'
      - 'evals/german_public/requirements.txt'
      - '.github/workflows/legalquad-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'evals/german_public/run_legalquad_retrieval.py'
      - 'evals/german_public/run_legalquad_e5_challenger.py'
      - 'evals/german_public/legalquad_candidate.json'
      - 'evals/german_public/requirements.txt'
      - '.github/workflows/legalquad-candidate.yml'

concurrency:
  group: legalquad-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: legalquad-${{ runner.os }}-${{ hashFiles('evals/german_public/requirements.txt') }}
          restore-keys: |
            german-retrieval-${{ runner.os }}-
            retrieval-models-${{ runner.os }}-
      - name: Install retrieval dependencies
        run: pip install -r evals/german_public/requirements.txt
      - name: Execute frozen LegalQuAD baseline tournament
        run: |
          python evals/german_public/run_legalquad_retrieval.py \
            --json-out legalquad-retrieval.json
      - name: Execute multilingual-E5-small challenger
        run: |
          python evals/german_public/run_legalquad_e5_challenger.py \
            --json-out legalquad-e5-challenger.json
      - name: Verify evidence, provenance and challenger boundary
        run: |
          python - <<'PY'
          import json
          base=json.load(open('legalquad-retrieval.json', encoding='utf-8'))
          ch=json.load(open('legalquad-e5-challenger.json', encoding='utf-8'))
          assert base['status'] == 'OBSERVED_GERMAN_LEGAL_RETRIEVAL_CANDIDATE', base
          assert base['dataset_revision'] == 'd9a3183ea8b7a592a5a0e008a50847377e719109', base
          assert base['counts_as_strict_third_german_suite'] is False, base
          lp=base['license_provenance']
          assert lp['mteb_mirror_declared_license'] == 'CC-BY-4.0', lp
          assert lp['original_repo_license_file_observed'] is False, lp
          assert lp['status'] == 'UPSTREAM_RIGHTS_CONFIRMATION_REQUIRED_BEFORE_STRICT_GATE', lp
          for method in ('bm25','dense_general','dense_german','hybrid_german_rrf'):
              assert method in base['methods'], method
              assert len(base['methods'][method]['rows']) == 200, method
          assert abs(base['methods']['bm25']['hit_at_10'] - 0.845) < 1e-12, base['methods']['bm25']

          assert ch['status'] == 'OBSERVED_GERMAN_LEGAL_RETRIEVER_CHALLENGER', ch
          assert ch['dataset_revision'] == base['dataset_revision'], ch
          assert ch['method'] == 'dense_e5_small', ch
          assert ch['model']['model_id'] == 'intfloat/multilingual-e5-small', ch
          assert len(ch['model']['model_revision']) == 40, ch['model']
          assert ch['model']['query_prefix'] == 'query: ', ch['model']
          assert ch['model']['passage_prefix'] == 'passage: ', ch['model']
          assert ch['counts_as_strict_third_german_suite'] is False, ch
          assert len(ch['metrics']['rows']) == 200, ch['metrics']
          for key in ('hit_at_1','hit_at_5','hit_at_10','recall_at_10','mrr_at_10'):
              assert 0 <= ch['metrics'][key] <= 1, (key,ch['metrics'][key])

          dense=base['methods']['dense_german']
          bm25=base['methods']['bm25']
          print('LEGALQUAD_BASELINE_SCOREBOARD=' + json.dumps(base['scoreboard'], ensure_ascii=False))
          print('E5_SMALL=' + json.dumps({k:v for k,v in ch['metrics'].items() if k != 'rows'}, ensure_ascii=False))
          print(f"E5_HIT10_DELTA_VS_DENSE_GERMAN={ch['metrics']['hit_at_10']-dense['hit_at_10']:+.3f}")
          print(f"E5_HIT10_DELTA_VS_BM25={ch['metrics']['hit_at_10']-bm25['hit_at_10']:+.3f}")
          print('STRICT_GATE_COUNTED=false')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('legalquad-retrieval.json') != '' }}
        with:
          name: legalquad-provenance-gated-candidate
          path: |
            legalquad-retrieval.json
            legalquad-e5-challenger.json
          if-no-files-found: error
          retention-days: 30
