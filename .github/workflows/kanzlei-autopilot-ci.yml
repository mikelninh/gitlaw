name: kanzlei-autopilot-ci

on:
  pull_request:
    paths:
      - 'pilot/law-firm/autopilot/**'
      - 'viewer/src/pro/**'
      - 'api/ask-pro.ts'
      - 'api/_lawyer-privacy.ts'
      - 'api/pro/privacy-readiness.ts'
      - 'api/pro/secure-sync.ts'
      - 'api/pro/sync.ts'
      - 'docs/kanzlei-autopilot/**'
      - 'viewer/package.json'
      - 'viewer/package-lock.json'
      - '.github/workflows/kanzlei-autopilot-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Check Autopilot core and connector syntax
        run: |
          node --check pilot/law-firm/autopilot/core.mjs
          node --check pilot/law-firm/autopilot/advoware-policy.mjs
          node --check pilot/law-firm/autopilot/advoware-client.mjs
          node --check pilot/law-firm/autopilot/advoware-sync.mjs
          node --check pilot/law-firm/autopilot/channel-intake.mjs

      - name: Prove authority and time-measurement boundaries
        run: node --test pilot/law-firm/autopilot/core.test.mjs

      - name: Prove Advoware reads and exact write approvals
        run: node --test pilot/law-firm/autopilot/advoware-client.test.mjs

      - name: Prove Advoware delta matching and morning brief
        run: node --test pilot/law-firm/autopilot/advoware-sync.test.mjs

      - name: Prove multi-channel intake, dedupe and real-data gate
        run: node --test pilot/law-firm/autopilot/channel-intake.test.mjs

      - name: Prove lawyer privacy fail-closed egress and signed receipts
        run: node --experimental-strip-types --test pilot/law-firm/autopilot/lawyer-privacy.test.mjs

      - name: Prove zero-knowledge encrypted vault confidentiality
        run: node --experimental-strip-types --test pilot/law-firm/autopilot/secure-vault.test.mjs

      - name: Prove Friday shadow pilot remains local-only
        run: node --test pilot/law-firm/autopilot/friday-pilot.test.mjs

      - name: Prove auth and UI contract
        run: node --test pilot/law-firm/autopilot/ui-contract.test.mjs

      - name: Install viewer dependencies
        working-directory: viewer
        run: npm install --no-audit --no-fund

      - name: Build authenticated Kanzlei workspace
        working-directory: viewer
        run: npm run build
