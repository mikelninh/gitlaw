# Fly.io push-to-deploy for the GitLaw MCP server.
#
# Deploys main when MCP/runtime files change. If FLY_API_TOKEN is not configured,
# the workflow stays valid and reports a clean skip instead of failing at parse time.
#
# Setup once:
#   1. flyctl auth login
#   2. flyctl auth token
#   3. Add it as repo secret FLY_API_TOKEN in GitHub → Settings → Secrets

name: Fly Deploy (MCP server)

on:
  push:
    branches: [main]
    paths:
      - "gitlaw_mcp/**"
      - "laws/**"
      - "fly.toml"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Fly.io (Frankfurt)
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Fly token not configured
        if: ${{ env.FLY_API_TOKEN == '' }}
        run: echo "FLY_API_TOKEN is not configured; deployment skipped."
      - uses: actions/checkout@v4
        if: ${{ env.FLY_API_TOKEN != '' }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: ${{ env.FLY_API_TOKEN != '' }}
      - name: Deploy
        if: ${{ env.FLY_API_TOKEN != '' }}
        run: flyctl deploy --remote-only
