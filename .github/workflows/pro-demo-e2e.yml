name: Pro demo browser E2E

on:
  pull_request:
    paths:
      - 'viewer/**'
      - 'pilot/law-firm/pro-demo.browser.e2e.mjs'
      - '.github/workflows/pro-demo-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - 'pilot/law-firm/pro-demo.browser.e2e.mjs'
      - '.github/workflows/pro-demo-e2e.yml'
  workflow_dispatch:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install viewer
        working-directory: viewer
        run: npm install --no-audit --no-fund
      - name: Build public viewer
        working-directory: viewer
        run: npm run build
      - name: Install browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start built viewer
        run: |
          npm run preview --prefix viewer -- --host 127.0.0.1 --port 4173 > /tmp/gitlaw-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/gitlaw/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gitlaw-preview.log
          exit 1
      - name: Exercise Pro demo and mobile regression
        run: node pilot/law-firm/pro-demo.browser.e2e.mjs
