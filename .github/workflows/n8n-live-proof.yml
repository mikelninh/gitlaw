name: n8n live proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "n8n/outcome-engine-live-proof.json"
      - ".github/workflows/n8n-live-proof.yml"
  push:
    branches:
      - feat/n8n-outcome-engine
    paths:
      - "n8n/outcome-engine-live-proof.json"
      - ".github/workflows/n8n-live-proof.yml"

permissions:
  contents: read

jobs:
  execute-live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_LOG_LEVEL: error
      N8N_ENCRYPTION_KEY: outcome-engine-ci-only-encryption-key-2026
      DB_TYPE: sqlite
      DB_SQLITE_DATABASE: /tmp/n8n-outcome-engine.sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install n8n
        run: npm install --global n8n@2.30.5 --no-audit --no-fund

      - name: Import proof workflow
        run: n8n import:workflow --input=n8n/outcome-engine-live-proof.json --skipMigrationChecks

      - name: Execute proof workflow
        run: |
          set -o pipefail
          n8n execute --id outcome-engine-live-proof 2>&1 | tee /tmp/n8n-live-proof.log

      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n8n-live-proof-evidence
          path: /tmp/n8n-live-proof.log
          if-no-files-found: warn
          retention-days: 14
